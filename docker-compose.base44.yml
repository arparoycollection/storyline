services:
  web:
    image: node:22-slim
    working_dir: /app
    ports:
      - "3000:5173"
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev"
    environment:
      - NODE_ENV=development
    restart: unless-stopped

volumes:
  node_modules:
